<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Miniräknare</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="calculator" role="application" aria-label="Miniräknare">
    <div class="display">
      <div class="history" id="history" aria-live="polite"></div>
      <div class="current" id="current">0</div>
    </div>

    <div class="keys">
      <button class="key key--fn" data-action="clear">AC</button>
      <button class="key key--fn" data-action="backspace" aria-label="Radera">⌫</button>
      <button class="key key--fn" data-value="%">%</button>
      <button class="key key--op" data-value="/">÷</button>

      <button class="key" data-value="7">7</button>
      <button class="key" data-value="8">8</button>
      <button class="key" data-value="9">9</button>
      <button class="key key--op" data-value="*">×</button>

      <button class="key" data-value="4">4</button>
      <button class="key" data-value="5">5</button>
      <button class="key" data-value="6">6</button>
      <button class="key key--op" data-value="-">−</button>

      <button class="key" data-value="1">1</button>
      <button class="key" data-value="2">2</button>
      <button class="key" data-value="3">3</button>
      <button class="key key--op" data-value="+">+</button>

      <button class="key key--zero" data-value="0">0</button>
      <button class="key" data-value=".">,</button>
      <button class="key key--equals" data-action="equals">=</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
